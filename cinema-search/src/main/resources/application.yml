server:
  port: ${SERVER_PORT:8086}
  tomcat:
    threads:
      max: 160
      min-spare: 16
    accept-count: 100
    max-connections: 2000
spring:
  application:
    name: cinema-search
  profiles:
    default: dev
  config:
    import:
      - classpath:cinema-common.yml
      - optional:nacos:cinema-search.yml?group=CINEMA
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/cinema_search?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&connectTimeout=2000&socketTimeout=10000&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:cinema_search}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
cinema:
  operations:
    enabled: false
  messaging:
    endpoints: ${ROCKETMQ_ENDPOINTS:rocketmq-broker:8081}

  search:
    endpoint: ${ELASTICSEARCH_URL:http://127.0.0.1:19200}

---
cinema:
  jobs:
    mode: ${CINEMA_JOBS_MODE:local}
    admin-addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://xxl-job:8080/xxl-job-admin}
    access-token: ${XXL_JOB_ACCESS_TOKEN:}
    executor-address: ${XXL_JOB_EXECUTOR_ADDRESS:}
    log-path: ${XXL_JOB_LOG_PATH:${java.io.tmpdir}/cinema-job-logs}
