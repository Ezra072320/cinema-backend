spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # prod 不提供本地默认口令：缺失即连接失败，避免误用开发默认值
    password: ${MYSQL_PASSWORD:}
  ai:
    openai:
      # 生产必须用 DASHSCOPE_API_KEY 注入真 key。占位值只让非 AI 业务起服，
      # AI 对话会显式报错而不是沿用不明兜底串。
      api-key: ${DASHSCOPE_API_KEY:local-placeholder}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-max
          max-tokens: 2048
      embedding:
        options:
          model: text-embedding-v3

mybatis-plus:
  configuration:
    # 生产不打印 SQL；StdOutImpl 类实现一律禁止
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 生产强制关闭接口文档，未授权请求拿不到 API 定义
cinema:
  docs:
    enabled: false
  captcha:
    # 生产强制验证码（dev 默认关闭以保留本地旧体验）
    required: true
  cors:
    # 必须注入生产前端域名白名单（逗号分隔）；禁止沿用 *
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost}

jwt:
  # prod 不提供默认签名密钥：未注入 JWT_SECRET 时启动即失败（JwtUtil fail-fast）
  secret: ${JWT_SECRET:}

knife4j:
  enable: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    edu.czu.cinema: warn
