server:
  port: 8080
  servlet:
    context-path: /

spring:
  config:
    import: optional:file:./config/tmdb-local.yml
  application:
    name: cinema-server
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # connect/socket 超时防慢 SQL 与网络挂起拖死线程；rewriteBatchedStatements 加速批量建票
    url: jdbc:mysql://localhost:3306/cinema?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&connectTimeout=3000&socketTimeout=30000&rewriteBatchedStatements=true
    username: root
    # 必填：不设 MYSQL_PASSWORD 时为空串，连接会失败——凭据禁止写入仓库
    password: ${MYSQL_PASSWORD:}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 30
      # 连接获取最多等 30s，快速失败而不是无限挂起（Druid 默认 -1 是无限等待）
      max-wait: 30000
      validation-query: SELECT 1
      test-while-idle: true
      keep-alive: true
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 100
  # 迁移执行器：空库自动跑完 V1~V21；存量库 baseline 到 21 后只执行新版本
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 21
    table: flyway_schema_history
  ai:
    openai:
      # 必填：真 key 用 DASHSCOPE_API_KEY 注入；占位符只保证不依赖模型的业务能起服
      api-key: ${DASHSCOPE_API_KEY:local-placeholder}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-max
          max-tokens: 2048
      embedding:
        options:
          model: text-embedding-v3

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志走 SLF4J 受 logging.level 控制；StdOutImpl 会把含参数的 SQL 明文打进 stdout
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

aliyun:
  oss:
    # 必填：不配置则上传功能报错；凭据禁止写入仓库
    access-key-id: ${ALIYUN_OSS_AK:}
    access-key-secret: ${ALIYUN_OSS_SK:}
    endpoint: https://oss-cn-chengdu.aliyuncs.com
    bucket-name: ${ALIYUN_OSS_BUCKET:cinema-bucket}

wechat:
  appid: ${WX_APPID:wx-placeholder}
  secret: ${WX_SECRET:secret-placeholder}

# ==== 业务配置 ====
cinema:
  tmdb:
    read-access-token: ${TMDB_READ_ACCESS_TOKEN:}
    api-key: ${TMDB_API_KEY:}
    proxy-url: ${TMDB_PROXY_URL:}
    request-interval-ms: 300
    timeout-ms: 15000

  # 影片同步: 只新增「大陆 + 未来待映 + 库中没有」的影片, 已有影片一律不修改.
  # 补缺走「补全缺失资料」(POST /api/admin/movie/repair), 纠错走人工补录.
  sync:
    maoyan-base-url: https://m.maoyan.com
    city-id: 1
    upcoming-days: 60
    request-interval-ms: 1500
    request-timeout-ms: 15000

  # 接口文档（Swagger/knife4j）总开关；prod 必须为 false
  docs:
    enabled: true
  # 登录/注册是否强制图形验证码；prod 必须为 true，本地联调可设 false
  captcha:
    required: ${CAPTCHA_REQUIRED:true}
  cors:
    # 逗号分隔的允许源模式；dev 默认 *，prod 注入显式域名
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:*}

# 必填：不设 JWT_SECRET 时为空串，启动即失败；至少 32 字节随机串
jwt:
  secret: ${JWT_SECRET:}
  expire-hours: 12

logging:
  level:
    edu.czu.cinema: info
    org.springframework.ai.chat.client.advisor: info

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
