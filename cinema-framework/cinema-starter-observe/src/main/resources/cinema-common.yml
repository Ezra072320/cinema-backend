spring:
  transaction:
    default-timeout: 10s
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    hikari:
      connection-init-sql: SET time_zone = '+08:00'
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 4
      connection-timeout: 2000
      initialization-fail-timeout: 60000
      validation-timeout: 1000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 1s
      connect-timeout: 1s
  cloud:
    loadbalancer:
      retry:
        enabled: false
      configurations: health-check
      eager-load:
        clients: cinema-identity,cinema-catalog,cinema-trade,cinema-ai
      cache:
        enabled: false
      health-check:
        path:
          default: /actuator/health/readiness
        interval: 5s
        refetch-instances: true
        refetch-instances-interval: 5s
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 3000
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
mybatis-plus:
  configuration:
    default-statement-timeout: 5
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
jwt:
  secret: ${JWT_SECRET:}
  expire-hours: 12
cinema:
  metrics:
    enabled: ${CINEMA_METRICS_ENABLED:false}
    key: ${CINEMA_METRICS_KEY:}
  internal:
    key: ${INTERNAL_SERVICE_KEY:}
  docs:
    enabled: ${API_DOCS_ENABLED:false}
  captcha:
    required: ${CAPTCHA_REQUIRED:true}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088}
  tmdb:
    read-access-token: ${TMDB_READ_ACCESS_TOKEN:}
    api-key: ${TMDB_API_KEY:}
    proxy-url: ${TMDB_PROXY_URL:}
    request-interval-ms: 300
    timeout-ms: 10000
  sync:
    maoyan-base-url: https://m.maoyan.com
    city-id: 1
    upcoming-days: 60
    request-interval-ms: 1500
    request-timeout-ms: 10000
aliyun:
  oss:
    access-key-id: ${ALIYUN_OSS_AK:}
    access-key-secret: ${ALIYUN_OSS_SK:}
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-chengdu.aliyuncs.com}
    bucket-name: ${ALIYUN_OSS_BUCKET:cinema-bucket}
wechat:
  appid: ${WX_APPID:}
  secret: ${WX_SECRET:}
management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
      show-details: never
springdoc:
  paths-to-match: /api/**
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
