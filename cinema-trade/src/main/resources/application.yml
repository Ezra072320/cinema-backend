server:
  port: ${SERVER_PORT:8083}
  tomcat:
    threads:
      max: 160
      min-spare: 16
    accept-count: 100
    max-connections: 2000
spring:
  application:
    name: cinema-trade
  profiles:
    default: dev
  config:
    import:
      - classpath:cinema-common.yml
      - optional:nacos:cinema-trade.yml?group=CINEMA
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/cinema_trade?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&connectTimeout=2000&socketTimeout=10000&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:cinema_trade}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY:local-placeholder}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-max
          max-tokens: 2048
      embedding:
        options:
          model: text-embedding-v3
cinema:
  messaging:
    enabled: ${CINEMA_MESSAGING_ENABLED:false}
    endpoints: ${ROCKETMQ_ENDPOINTS:rocketmq-broker:8081}

seata:
  enabled: ${SEATA_ENABLED:false}
  application-id: cinema-trade
  tx-service-group: cinema_tx_group
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT
  registry:
    type: file
  config:
    type: file
  service:
    vgroup-mapping:
      cinema_tx_group: default
    grouplist:
      default: ${SEATA_SERVER:127.0.0.1:18091}
  client:
    rm:
      report-success-enable: true

---
cinema:
  transactions:
    lab:
      enabled: ${CINEMA_TRANSACTIONS_LAB_ENABLED:false}

---
cinema:
  jobs:
    mode: ${CINEMA_JOBS_MODE:local}
    admin-addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://xxl-job:8080/xxl-job-admin}
    access-token: ${XXL_JOB_ACCESS_TOKEN:}
    executor-address: ${XXL_JOB_EXECUTOR_ADDRESS:}
    log-path: ${XXL_JOB_LOG_PATH:${java.io.tmpdir}/cinema-job-logs}
    lab:
      enabled: ${CINEMA_JOBS_LAB_ENABLED:false}

---
cinema:
  governance:
    enabled: ${CINEMA_GOVERNANCE_ENABLED:false}
spring:
  cloud:
    sentinel:
      transport:
        client-ip: ${SENTINEL_CLIENT_IP:}
        port: 8719
