# Explicit application files only: Alloy has no Docker socket or host filesystem access.
x-log-env: &log-env
  SPRING_PROFILES_ACTIVE: local-logs
x-log-volume: &log-volume
  - application-logs:/app/logs
x-log-dependency: &log-dependency
  app-log-init: {condition: service_completed_successfully}
services:
  grafana:
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/logs.json
  app-log-init:
    image: apache/rocketmq:5.3.4
    profiles: [logs]
    user: '0:0'
    restart: 'no'
    entrypoint: [sh, -ec, 'chown 10001:10001 /logs']
    volumes: [application-logs:/logs]
    networks: [cinema]
  identity:
    environment: *log-env
    volumes: *log-volume
    depends_on: *log-dependency
  catalog:
    environment: *log-env
    volumes: *log-volume
    depends_on: *log-dependency
  trade:
    environment: *log-env
    volumes: *log-volume
    depends_on: *log-dependency
  ai:
    environment: *log-env
    volumes: *log-volume
    depends_on: *log-dependency
  gateway:
    environment: *log-env
    volumes: *log-volume
    depends_on: *log-dependency
  notify:
    environment: *log-env
    volumes: *log-volume
    depends_on: *log-dependency
  benefit:
    environment: *log-env
    volumes: *log-volume
    depends_on: *log-dependency
  loki:
    image: cinema/loki:local
    build: {context: ./deploy/local/loki}
    profiles: [logs]
    restart: unless-stopped
    mem_limit: 384m
    command: [-config.file=/etc/loki/cinema.yml]
    ports: ['127.0.0.1:13100:3100']
    volumes:
      - ./deploy/local/observe/loki.yml:/etc/loki/cinema.yml:ro
      - loki-data:/loki
    networks: [cinema]
    healthcheck:
      test: [CMD, /busybox, wget, -q, -O, /dev/null, http://127.0.0.1:3100/ready]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12
  alloy:
    image: grafana/alloy:v1.21.2@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18
    profiles: [logs]
    restart: unless-stopped
    mem_limit: 256m
    command: [run, --storage.path=/var/lib/alloy, --server.http.listen-addr=0.0.0.0:12345, --disable-reporting, /etc/alloy/config.alloy]
    ports: ['127.0.0.1:12345:12345']
    volumes:
      - ./deploy/local/observe/config.alloy:/etc/alloy/config.alloy:ro
      - application-logs:/var/log/cinema:ro
      - alloy-data:/var/lib/alloy
    networks: [cinema]
    depends_on:
      loki: {condition: service_healthy}
      app-log-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /bin/bash, -ec, 'exec 3<>/dev/tcp/127.0.0.1/12345']
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 12
volumes:
  application-logs: {}
  loki-data: {}
  alloy-data: {}
