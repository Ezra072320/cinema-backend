# Combine base + messaging + transactions + jobs; every role remains a singleton.
services:
  xxl-job:
    image: cinema/job-admin:local
    build: {context: ./deploy/local/job}
    profiles: [jobs]
    restart: unless-stopped
    mem_limit: 640m
    environment:
      LOGGING_CONFIG: /app/logback-console.xml
      JAVA_TOOL_OPTIONS: '-Dlogback.configurationFile=/app/logback-console.xml -Dlogging.config=/app/logback-console.xml'
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cinema_job?serverTimezone=Asia/Shanghai&connectTimeout=2000&socketTimeout=10000
      SPRING_DATASOURCE_USERNAME: cinema_job
      SPRING_DATASOURCE_PASSWORD: ${JOB_DB_PASSWORD:?Run init-jobs.py}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 6
      XXL_JOB_ACCESSTOKEN: ${XXL_JOB_ACCESS_TOKEN:?Run init-jobs.py}
    ports: ['127.0.0.1:11880:8080']
    volumes: ['./deploy/local/job/logback-console.xml:/app/logback-console.xml:ro']
    networks: [cinema]
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: [CMD, bash, -ec, 'exec 3<>/dev/tcp/127.0.0.1/8080']
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 18
  job-volume-init:
    image: apache/rocketmq:5.3.4
    profiles: [jobs]
    user: '0:0'
    restart: 'no'
    entrypoint: [sh, -ec, 'chown 10001:10001 /logs']
    volumes: [job-executor-logs:/logs]
    networks: [cinema]
  catalog:
    environment:
      CINEMA_JOBS_MODE: xxl
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job:8080/xxl-job-admin
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:?Run init-jobs.py}
      XXL_JOB_EXECUTOR_ADDRESS: http://catalog:9999/
      XXL_JOB_LOG_PATH: /app/job-logs/catalog
    volumes: [job-executor-logs:/app/job-logs]
    depends_on:
      xxl-job: {condition: service_healthy}
      job-volume-init: {condition: service_completed_successfully}
  ai:
    environment:
      CINEMA_JOBS_MODE: xxl
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job:8080/xxl-job-admin
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:?Run init-jobs.py}
      XXL_JOB_EXECUTOR_ADDRESS: http://ai:9999/
      XXL_JOB_LOG_PATH: /app/job-logs/ai
    volumes: [job-executor-logs:/app/job-logs]
    depends_on:
      xxl-job: {condition: service_healthy}
      job-volume-init: {condition: service_completed_successfully}
  trade:
    environment:
      CINEMA_JOBS_MODE: xxl
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job:8080/xxl-job-admin
      XXL_JOB_ACCESS_TOKEN: ${XXL_JOB_ACCESS_TOKEN:?Run init-jobs.py}
      XXL_JOB_EXECUTOR_ADDRESS: http://trade:9999/
      XXL_JOB_LOG_PATH: /app/job-logs
      CINEMA_JOBS_LAB_ENABLED: 'true'
    volumes: [job-executor-logs:/app/job-logs]
    depends_on:
      xxl-job: {condition: service_healthy}
      job-volume-init: {condition: service_completed_successfully}
volumes:
  job-executor-logs: {}
