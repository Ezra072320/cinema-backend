apiVersion: v1
kind: Namespace
metadata:
  name: cinema
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cinema-runtime
  namespace: cinema
data:
  NACOS_ADDR: "nacos-0.nacos.platform.svc.cluster.local:8848,nacos-1.nacos.platform.svc.cluster.local:8848,nacos-2.nacos.platform.svc.cluster.local:8848"
  NACOS_NAMESPACE: "cinema-prod"
  NACOS_USERNAME: "cinema-app"
  SPRING_DATA_REDIS_SENTINEL_MASTER: "cinema"
  SPRING_DATA_REDIS_SENTINEL_NODES: "redis-sentinel-0.redis.platform.svc.cluster.local:26379,redis-sentinel-1.redis.platform.svc.cluster.local:26379,redis-sentinel-2.redis.platform.svc.cluster.local:26379"
  SERVER_PORT: "8080"
  CORS_ALLOWED_ORIGINS: "https://cinema.example.com"
  DB_POOL_SIZE: "20"
  CAPTCHA_REQUIRED: "true"
  API_DOCS_ENABLED: "false"
  CINEMA_ADMISSION_CATALOG_RATE: "1000"
  CINEMA_ADMISSION_TRADE_RATE: "300"
  CINEMA_ADMISSION_BOOKING_RATE: "80"
  CINEMA_ADMISSION_IDENTITY_RATE: "100"
  CINEMA_ADMISSION_AI_RATE: "10"
  SENTINEL_DASHBOARD: "sentinel.platform.svc.cluster.local:8858"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError -Duser.timezone=Asia/Shanghai"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: business-private-ingress
  namespace: cinema
spec:
  podSelector:
    matchLabels: {cinema-tier: business}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/part-of: cinema}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
      ports: [{port: 8080, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
  namespace: cinema
spec:
  podSelector:
    matchLabels: {app: cinema-gateway}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
        - podSelector: {matchLabels: {app.kubernetes.io/part-of: cinema}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
      ports: [{port: 8080, protocol: TCP}]
