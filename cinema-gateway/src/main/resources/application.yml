server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: cinema-gateway
  config:
    import: optional:nacos:cinema-gateway.yml?group=CINEMA
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 300ms
      timeout: 300ms
  cloud:
    loadbalancer:
      retry:
        enabled: false
      configurations: health-check
      eager-load:
        clients: cinema-identity,cinema-catalog,cinema-trade,cinema-ai
      cache:
        enabled: false
      health-check:
        path:
          default: /actuator/health/readiness
        interval: 5s
        refetch-instances: true
        refetch-instances-interval: 5s
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/api/**]':
                allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088}
                allowed-methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
                allowed-headers: ['*']
                exposed-headers: [Authorization, X-Trace-Id]
                allow-credentials: true
                max-age: 3600
          httpclient:
            connect-timeout: 1000
            response-timeout: 5s
            pool:
              type: fixed
              max-connections: 500
              acquire-timeout: 300
              max-idle-time: 30s
          discovery:
            locator:
              enabled: false
resilience4j:
  timelimiter:
    instances:
      upload:
        timeoutDuration: 30s
    configs:
      default:
        timeoutDuration: 5s
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 50
        minimumNumberOfCalls: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,redis
